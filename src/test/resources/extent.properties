# ---------------------------------------------------------------------------
# Extent Reports configuration
#
# MUST live on the TEST CLASS PATH (src/test/resources). The adapter looks for
# exactly "extent.properties" at the root of the class path first.
#
# IMPORTANT - only these keys are actually read by the Cucumber 7 adapter
# (verified against ExtentService in extentreports-cucumber7-adapter:1.14.0):
#
#   extent.reporter.spark.start   true/false - enable the HTML dashboard
#   extent.reporter.spark.out     output DIRECTORY or file for the report
#   extent.reporter.spark.config  path to a Spark XML config file (title, theme...)
#   extent.reporter.spark.vieworder   dashboard,test,exception,logs
#   extent.reporter.spark.statusfilter  e.g. PASS,FAIL
#   extent.reporter.spark.timeline    (NOT supported by this adapter version)
#   basefolder.name / basefolder.datetimepattern   prefix for output paths
#   systeminfo.<key>              free-form rows on the dashboard
#   screenshot.dir / screenshot.relativepath
#
# Report TITLE, THEME and ENCODING are NOT settable through this file. They come
# from the XML config referenced by extent.reporter.spark.config - see
# src/test/resources/spark-config.xml.
# ---------------------------------------------------------------------------

# ------------------------------------------------------------------- spark
# Spark is the interactive HTML dashboard - the main deliverable.
extent.reporter.spark.start=true

# Output path, relative to the project root. The adapter appends the report
# folder itself, so the final file lands at:
#   target/extent-report/SparkReport/Spark.html
extent.reporter.spark.out=target/extent-report/

# Title, theme and encoding live here - the only way to set them.
extent.reporter.spark.config=src/test/resources/spark-config.xml

# Show the timeline on the dashboard.
extent.reporter.spark.vieworder=dashboard,test,exception,logs

# ------------------------------------------------------------------- naming
# Prefix applied to the output path. Kept empty (see datetimepattern below) so
# re-runs overwrite ONE known file instead of scattering timestamped folders
# that CI would have to glob.
basefolder.name=
# Empty pattern => no timestamp folder is created.
basefolder.datetimepattern=

# ------------------------------------------------------------- screenshots
# The adapter calls base64PngImageStyle() unconditionally, so an image attached
# in Hooks (media type image/png) is inlined as base64 automatically. That is
# what we want: the HTML stays self-contained, so it still shows screenshots
# after being downloaded as a CI artefact or emailed.
screenshot.dir=target/extent-report/screenshots/

# ------------------------------------------------------- environment details
# Rendered as the system-information table on the dashboard. Purely
# informational; safe to edit or extend.
systeminfo.App=PlayWrightJava
systeminfo.Framework=BDD / Playwright / Cucumber-JVM
systeminfo.Report=Extent Reports (Spark)

# --------------------------------------------------------------------- movies
# Optional: attach the Playwright video of a failed scenario as a link.
# Off by default because this framework does not record video.
#extent.reporter.spark.moviename=

# --------------------------------------------------------------------- Klov
# Klov is a separate report SERVER. Off: this framework publishes to CI
# artefacts instead. To push to Klov, set start=true and point at the host.
extent.reporter.klov.start=false
#extent.reporter.klov.config=src/test/resources/klov-config.xml

# --------------------------------------------------------------------- PDF
# PDF/Excel export. Off by default: they add build time and pull extra
# renderers. Enable only when the artefact is genuinely required.
extent.reporter.pdf.start=false
extent.reporter.excel.start=false