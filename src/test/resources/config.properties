# ---------------------------------------------------------------------------
# Fallback configuration for the framework.
#
# Precedence (first match wins):
#   1. JVM system property   -DBASE_URL=https://staging.example.com
#   2. Environment variable  BASE_URL=https://staging.example.com
#   3. A .env file in the project root
#   4. This file
#   5. Built-in defaults in ConfigLoader
#
# Do NOT put real secrets here - this file is committed. Use .env (git-ignored)
# or CI secrets instead.
# ---------------------------------------------------------------------------

ENV=dev

# --- UI (login) -------------------------------------------------------------
BASE_URL=https://the-internet.herokuapp.com
UI_USERNAME=tomsmith
UI_PASSWORD=SuperSecretPassword!

# --- API --------------------------------------------------------------------
# jsonplaceholder: no API key and no daily quota, so the suite is green out of the box.
# reqres.in is richer but caps anonymous use at 40 requests/day per IP;
# switch to it only with a working key:
#   API_BASE_URL=https://reqres.in
#   API_KEY=<your-reqres-key>
API_BASE_URL=https://jsonplaceholder.typicode.com
API_KEY=
API_USERNAME=eve.holt@reqres.in
API_PASSWORD=cityslicka

# --- Execution --------------------------------------------------------------
HEADLESS=true
SLOW_MO=0
DEFAULT_TIMEOUT=30000
API_TIMEOUT=60000
ARTIFACT_DIR=target/artifacts
